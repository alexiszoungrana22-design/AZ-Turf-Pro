<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon abonnement - AZ Turf Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-header">
        <div class="logo">
            🏇 <span>AZ Turf Pro</span>
        </div>
        <nav class="top-menu">
            <a href="index.html">🏠 Accueil</a>
            <a href="analyse.html">📊 Analyse</a>
            <a href="historique.html">🏆 Historique</a>
        </nav>
        <a href="abonnement.html" class="btn-vip">💎 Premium</a>
    </header>

    <main class="content">
        <section class="card">
            <h1>⭐ Mon abonnement Premium</h1>
            <p>Consultez votre statut et vos informations d'abonnement.</p>
        </section>

        <section class="card">
            <div id="infos-abonnement">
                Chargement de votre abonnement...
            </div>
        </section>

        <section class="card" id="renouvellement" style="display:none;">
            <h2>🔄 Renouvellement</h2>
            <p>Votre abonnement est arrivé à expiration ou n'est pas actif.</p>
            <button onclick="renouveler()">⭐ Renouveler votre abonnement</button>
        </section>
    </main>

    <footer class="bottom-menu">
        <a href="index.html">🏠 Accueil</a>
        <a href="analyse.html">📊 Analyse</a>
        <a href="abonnement.html">💎 Premium</a>
        <a href="mon-abonnement.html">👤 Mon Compte</a>
    </footer>

    <script>
        const API = "https://az-turf-pro.onrender.com/api/premium/";

        // Fonction pour formater proprement les dates ISO
        function formaterDate(dateString) {
            if (!dateString || dateString === "-") return "-";
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return dateString;
                return date.toLocaleDateString("fr-FR", {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                });
            } catch (e) {
                return dateString;
            }
        }

        async function chargerAbonnement() {
            const telephone = localStorage.getItem("AZ_TURF_TELEPHONE");
            const zone = document.getElementById("infos-abonnement");

            if (!telephone) {
                zone.innerHTML = "❌ Aucun numéro d'abonnement trouvé en mémoire. Veuillez souscrire à une offre.";
                document.getElementById("renouvellement").style.display = "block";
                return;
            }

            try {
                const reponse = await fetch(API + encodeURIComponent(telephone));
                const data = await reponse.json();

                if (!reponse.ok) {
                    zone.innerHTML = "❌ Abonnement introuvable pour ce numéro.";
                    document.getElementById("renouvellement").style.display = "block";
                    return;
                }

                // Récupération sécurisée des variables (avec valeurs de secours)
                const telAffiche = data.telephone || telephone;
                const offreAffiche = data.offre || "Pack Premium";
                const paiementAffiche = data.paiement || "Mobile Money";
                const prixAffiche = data.prix ? `${data.prix} FCFA` : "Validé";
                const dateDebut = formaterDate(data.date_debut);
                const dateFin = formaterDate(data.date_fin);
                const statut = data.statut || "INACTIF";

                // Couleur du statut
                const couleurStatut = statut === "ACTIF" ? "green" : "red";

                zone.innerHTML = `
                    <h2>📱 Téléphone</h2>
                    <p>${telAffiche}</p>

                    <h2>⭐ Offre</h2>
                    <p>${offreAffiche}</p>

                    <h2>💳 Paiement</h2>
                    <p>${paiementAffiche}</p>

                    <h2>💰 Prix</h2>
                    <p>${prixAffiche}</p>

                    <h2>📌 Statut</h2>
                    <p><strong style="color: ${couleurStatut};">${statut}</strong></p>

                    <h2>📅 Début</h2>
                    <p>${dateDebut}</p>

                    <h2>⏳ Expiration</h2>
                    <p>${dateFin}</p>
                `;

                if (statut !== "ACTIF") {
                    document.getElementById("renouvellement").style.display = "block";
                }

            } catch (error) {
                console.error("Erreur chargement abonnement :", error);
                zone.innerHTML = "❌ Erreur de connexion au serveur.";
            }
        }

        function renouveler() {
            window.location.href = "abonnement.html";
        }

        chargerAbonnement();
    </script>
</body>
</html>
