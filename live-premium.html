<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Turf Pro - Live VIP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        #btn-toggle-tableau {
            background: #10b981; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 15px; 
            margin: 20px 0;
            width: 100%;
        }
        table {
            width: 100%; 
            border-collapse: collapse; 
            background: #111827; 
            color: #fff; 
            border-radius: 8px;
            overflow: hidden;
        }
        th {
            background: #1f2937; 
            text-align: left; 
            font-size: 14px; 
            color: #9ca3af;
            padding: 12px;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #374151;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bouton pour afficher/masquer le tableau -->
        <button id="btn-toggle-tableau">
            📊 Afficher le Tableau des Partants (Live)
        </button>

        <!-- Le Tableau (Masqué par défaut) -->
        <div id="conteneur-tableau" style="display: none;">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Rang</th>
                            <th>N°</th>
                            <th>Cheval</th>
                            <th>Indice AZ</th>
                            <th>Confiance</th>
                        </tr>
                    </thead>
                    <tbody id="all-horses">
                        <!-- Les données de l'API s'injecteront ici -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Tout le code JavaScript est directement ici -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btnToggle = document.getElementById("btn-toggle-tableau");
            const conteneurTableau = document.getElementById("conteneur-tableau");

            if (btnToggle && conteneurTableau) {
                btnToggle.addEventListener("click", () => {
                    if (conteneurTableau.style.display === "none") {
                        conteneurTableau.style.display = "block";
                        btnToggle.innerHTML = "📊 Masquer le Tableau des Partants";
                        btnToggle.style.background = "#ef4444"; 

                        chargerDonneesLive();
                    } else {
                        conteneurTableau.style.display = "none";
                        btnToggle.innerHTML = "📊 Afficher le Tableau des Partants (Live)";
                        btnToggle.style.background = "#10b981"; 
                    }
                });
            }
        });

        async function chargerDonneesLive() {
            const tableau = document.getElementById("all-horses");
            if (!tableau) return;

            tableau.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #9ca3af; padding: 15px;">Chargement en cours...</td></tr>`;

            try {
                const reponse = await fetch("https://az-turf-pro.onrender.com/api/analyse"); 
                
                if (!reponse.ok) {
                    throw new Error(`Erreur HTTP : ${reponse.status}`);
                }

                const data = await reponse.json();
                const listeCheval = data.classement;

                if (Array.isArray(listeCheval) && listeCheval.length > 0) {
                    tableau.innerHTML = "";
                    
                    listeCheval.forEach(cheval => {
                        const rang = cheval.rang ?? "-";
                        const numero = cheval.numero ?? "-"; 
                        const nom = cheval.nom || "-";
                        const indice = cheval.indice_az ? Math.round(cheval.indice_az) : "-";
                        const confiance = cheval.confiance ? cheval.confiance + " %" : "-";

                        tableau.innerHTML += `
                            <tr>
                                <td style="color: #fff;"><strong>${rang}</strong></td>
                                <td style="color: #fff;"><strong>${numero}</strong></td>
                                <td style="color: #fff;">${nom}</td>
                                <td><span style="background: #1f2937; padding: 4px 8px; border-radius: 4px; color: #10b981; font-weight: bold;">${indice}</span></td>
                                <td style="color: #fff;">${confiance}</td>
                            </tr>
                        `;
                    });
                } else {
                    tableau.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444; padding: 15px;">Le tableau 'classement' est vide.</td></tr>`;
                }
            } catch (erreur) {
                console.error("Erreur attrapée :", erreur);
                tableau.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444; padding: 15px;">Erreur : ${erreur.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
