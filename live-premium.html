<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Premium Live - AZ Turf Pro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .zone-masquee { display: none !important; }
        .numero-cheval {
            display: inline-block;
            background-color: #0f172a;
            color: #ffffff;
            font-weight: bold;
            width: 38px;
            height: 38px;
            line-height: 38px;
            text-align: center;
            border-radius: 50%;
            margin: 3px;
        }
        .ticket-box { background: #fffbeb; border: 2px solid #f59e0b; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <button id="btn-toggle-tableau" style="background: #10b981; color: white; padding: 10px; border-radius: 8px; cursor: pointer;">
        📊 Afficher le Tableau des Partants (Live)
    </button>

    <!-- Tableau -->
    <div id="conteneur-tableau" class="zone-masquee" style="margin-top: 15px;">
        <table style="width: 100%; border-collapse: collapse; background: #fff;">
            <thead>
                <tr style="background: #f1f5f9;">
                    <th>Rang</th><th>N°</th><th>Cheval</th><th>Indice AZ</th><th>Confiance</th>
                </tr>
            </thead>
            <tbody id="all-horses"></tbody>
        </table>
    </div>
</header>

<main id="contenu-premium" class="zone-masquee">
    <div class="ticket-box">
        <h3>🏆 Quinté Premium</h3>
        <div id="quinte-premium"></div>
    </div>
    <div class="ticket-box">
        <h3>🔒 Champ réduit</h3>
        <div id="champ-reduit-premium"></div>
    </div>
</main>

<script src="live-premium.js"></script>
</body>
</html>
