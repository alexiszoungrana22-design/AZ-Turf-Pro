<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activation Premium - AZ Turf Pro</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="top-header">

<div class="logo">
🏇 <span>AZ Turf Pro</span>
</div>


<nav class="top-menu">

<a href="index.html">
🏠 Accueil
</a>

<a href="ticket-premium.html">
⭐ Premium
</a>

</nav>

</header>





<main class="content">


<section class="card">

<h1>🏆 Activation Premium</h1>

<p>
Finalisez votre abonnement AZ Turf Pro.
</p>

</section>





<section class="card">

<h2>📱 Informations paiement</h2>


<p>
Numéro utilisé :
</p>

<strong id="telephone-affiche">
Chargement...
</strong>


<br><br>


<label>
🔖 Référence de paiement
</label>


<input
id="reference"
type="text"
placeholder="Exemple : OM12345678"
class="input-premium"
>


</section>







<section class="card">


<button id="activer-premium">

✅ Activer mon Premium

</button>


<br><br>


<p id="message">

</p>


</section>






</main>








<footer class="bottom-menu">


<a href="index.html">
🏠 Accueil
</a>


<a href="analyse.html">
📊 Analyse
</a>


<a href="ticket-premium.html">
🎟️ Ticket Premium
</a>


<a href="historique.html">
🏆 Historique
</a>


</footer>







<script>


const API_URL =

"https://az-turf-pro.onrender.com/api/activation";



const telephone =

localStorage.getItem(
"AZ_TURF_TELEPHONE"
);



const affichage =

document.getElementById(
"telephone-affiche"
);



const message =

document.getElementById(
"message"
);




if(telephone){

affichage.innerHTML = telephone;

}

else{

affichage.innerHTML =
"Aucun numéro trouvé";

}





document.getElementById(
"activer-premium"
)
.onclick = async function(){



const reference =

document.getElementById(
"reference"
)
.value
.trim();




if(!telephone){

message.innerHTML =
"❌ Numéro introuvable";

return;

}




if(!reference){

message.innerHTML =
"❌ Entrez la référence de paiement";

return;

}





try{


const reponse = await fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

telephone: telephone,

reference: reference

})

}

);





const data = await reponse.json();





if(!reponse.ok){

throw new Error(
data.detail || "Erreur activation"
);

}




localStorage.setItem(
"AZ_TURF_PREMIUM",
"ACTIF"
);



message.innerHTML =

"✅ Premium activé<br>" +

"Expiration : " +

new Date(
data.date_fin
)
.toLocaleDateString();




setTimeout(()=>{

window.location.href =
"ticket-premium.html";

},3000);




}


catch(error){


message.innerHTML =

"❌ " + error.message;


}



};



</script>





</body>

</html>
