<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activation Premium - AZ Turf Pro</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="top-header">


<div class="logo">

🏇 <span>AZ Turf Pro</span>

</div>


<nav class="top-menu">

<a href="index.html">
🏠 Accueil
</a>


<a href="ticket.html">
⭐ Premium
</a>

</nav>


</header>





<main class="content">



<section class="card">

<h1>🏆 Activation Premium</h1>

<p>
Finalisez votre abonnement AZ Turf Pro Premium.
</p>

</section>





<section class="card">

<h2>📋 Informations abonnement</h2>


<div id="infos-compte">

Chargement...

</div>


</section>






<section class="card">

<h2>⭐ Statut du compte</h2>


<p id="statut-compte">

Vérification...

</p>


<button id="activer-premium">

Activer mon Premium

</button>


<br><br>


<button id="acceder-premium">

Accéder à mon espace Premium

</button>


</section>




</main>






<footer class="bottom-menu">


<a href="index.html">
🏠 Accueil
</a>


<a href="analyse.html">
📊 Analyse
</a>


<a href="ticket.html">
🎟️ Ticket
</a>


<a href="historique.html">
🏆 Historique
</a>


<a href="ticket.html">
⭐ Premium
</a>


</footer>







<script>


const infos =
document.getElementById("infos-compte");


const statut =
document.getElementById("statut-compte");



function afficherInfos(){


const offre =
localStorage.getItem("AZ_TURF_OFFRE") || "Non sélectionnée";


const prix =
localStorage.getItem("AZ_TURF_PRIX") || "-";


const duree =
localStorage.getItem("AZ_TURF_DUREE") || "-";


const paiement =
localStorage.getItem("AZ_TURF_PAIEMENT") || "Non choisi";



infos.innerHTML = `

<p>
⭐ Formule :
<strong>${offre}</strong>
</p>


<p>
💰 Montant :
<strong>${prix} FCFA</strong>
</p>


<p>
⏳ Durée :
<strong>${duree} jours</strong>
</p>


<p>
💳 Paiement :
<strong>${paiement}</strong>
</p>

`;



const actif =
localStorage.getItem("AZ_TURF_PREMIUM");


if(actif === "ACTIF"){


statut.innerHTML =
"✅ Compte Premium actif";


}


}




document.getElementById("activer-premium")
.onclick=function(){



const duree =
parseInt(
localStorage.getItem("AZ_TURF_DUREE")
) || 30;



const debut =
new Date();



const expiration =
new Date();



expiration.setDate(
expiration.getDate()+duree
);



localStorage.setItem(
"AZ_TURF_DATE_DEBUT",
debut.toISOString()
);



localStorage.setItem(
"AZ_TURF_DATE_FIN",
expiration.toISOString()
);



localStorage.setItem(
"AZ_TURF_PREMIUM",
"ACTIF"
);



statut.innerHTML =
"✅ Votre accès Premium est activé";


alert(
"Votre abonnement Premium est actif."
);


};






document.getElementById("acceder-premium")
.onclick=function(){


window.location.href =
"ticket.html";


};




afficherInfos();



</script>




</body>

</html>
