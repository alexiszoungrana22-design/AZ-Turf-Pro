<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analyse AZ Turf Pro</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="top-header">

<div class="logo">
🏇 <span>AZ Turf Pro</span>
</div>


<nav class="top-menu">

<a href="index.html">🏠 Accueil</a>

<a href="analyse.html">📊 Analyse</a>

</nav>

</header>




<main class="content">



<section class="card">

<h2>📋 Tous les partants</h2>

<div class="table-container">

<table>

<thead>

<tr>

<th>N°</th>
<th>Cheval</th>
<th>Indice AZ</th>
<th>Rang</th>

</tr>

</thead>


<tbody id="all-horses">

</tbody>


</table>

</div>

</section>





<section class="card">


<h2>⭐ Les 7 chevaux retenus AZ</h2>


<div id="selected-horses">


Chargement...


</div>



</section>





</main>





<footer class="bottom-menu">

<a href="ticket.html">
🎟️ Ticket
</a>


<a href="historique.html">
🏆 Historique
</a>


<a href="espace-vip.html">
⭐ VIP
</a>


</footer>





<script>


const API =
"https://az-turf-pro.onrender.com/api/analyse";



async function chargerAnalyse(){


try{


const response = await fetch(API);

const data = await response.json();



// Tous les partants

const all =
data.chevaux || [];



const allBox =
document.getElementById("all-horses");



allBox.innerHTML = "";



all.forEach(cheval=>{


allBox.innerHTML += `

<tr>

<td>
${cheval.numero}
</td>


<td>
${cheval.nom}
</td>


<td>
${cheval.indice_az || "-"}
</td>


<td>
-
</td>


</tr>

`;


});






// Les 7 retenus


const retenus =
data.classement || data.chevaux || [];



const box =
document.getElementById("selected-horses");



box.innerHTML = "";



retenus.slice(0,7).forEach((cheval,index)=>{


box.innerHTML += `


<div class="card">


<h3>

${index+1}️⃣ 
N°${cheval.numero} 
${cheval.nom}

</h3>


<p>
📈 Indice AZ :
<strong>
${cheval.indice_az}
</strong>
</p>


<p>
🏆 Rang AZ :
<strong>
${cheval.rang}
</strong>
</p>


<p>

✅ Retenu pour son profil AZ et son indice de performance.

</p>


</div>


`;


});



}


catch(error){

console.log(error);

}


}



document.addEventListener(
"DOMContentLoaded",
chargerAnalyse
);



</script>



</body>

</html>
