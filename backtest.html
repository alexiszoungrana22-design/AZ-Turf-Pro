<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AZ Turf Pro — Backtest</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="modules-az.css"></head><body><main class="content"><section class="stats-container"><h2>📊 Performances & Backtesting</h2><p>Simulation sur l'historique réellement enregistré dans le navigateur.</p><div class="filter-group"><label>Cote min <input id="bt-cote-min" type="number" value="3" step="0.5"></label><label>Cote max <input id="bt-cote-max" type="number" value="12" step="0.5"></label><label>Mise <input id="bt-mise" type="number" value="10" step="1"></label><button id="bt-run" class="btn-analyser" type="button">Lancer</button></div><div id="backtest-status" style="margin-top:12px"></div><div id="backtest-results" class="results-grid" style="display:none"><div class="stat-box"><span class="stat-title">Mises</span><span id="res-mises" class="stat-val">0</span></div><div class="stat-box"><span class="stat-title">Gains</span><span id="res-gains" class="stat-val">0</span></div><div class="stat-box"><span class="stat-title">Profit</span><span id="res-profit" class="stat-val">0</span></div><div class="stat-box highlight"><span class="stat-title">ROI</span><span id="res-roi" class="stat-val">0 %</span></div></div></section></main><script src="script.js"></script><script>document.getElementById('bt-run')?.addEventListener('click',()=>window.lancerBacktest?.());</script></body></html>
